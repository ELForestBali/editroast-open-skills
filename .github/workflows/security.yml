name: Open Skills source, archive and workflow checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_release.py
      - run: python scripts/security_check.py
      - run: python -m unittest discover -s tests -v
